# Install inside nginx's http context (Ubuntu: /etc/nginx/sites-enabled/).
# HTTP bootstrap for routing checks. Enable HTTPS before browser AI usage.
# Existing Node server permits only loopback Host and matching Origin.
# Map only this site's Origin; foreign origins remain unchanged and get rejected.
map $http_origin $huahuole_backend_origin {
    default $http_origin;
    "http://huahuole.sidecraftlab.com" "http://127.0.0.1:5173";
    "https://huahuole.sidecraftlab.com" "http://127.0.0.1:5173";
}

server {
    listen 80;
    server_name huahuole.sidecraftlab.com;

    # Reject unrelated domains even if this server becomes nginx's default.
    if ($host != huahuole.sidecraftlab.com) { return 404; }

    client_max_body_size 10m;
    access_log /var/log/nginx/huahuole.access.log;
    error_log /var/log/nginx/huahuole.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:5173;
        proxy_set_header Origin $huahuole_backend_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        # Manual result recovery can wait on the provider for up to 240s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_buffering off;
    }
}
